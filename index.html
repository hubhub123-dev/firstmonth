<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9eff1">
  <meta name="description" content="One month down, and hopefully a lifetime to go. A little love letter, just for you.">
  <meta name="robots" content="noindex, nofollow">
  <title>For you, darling ♡</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/her.jpg" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="music.js" defer></script>
  <script src="letter.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="petals" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <a class="wordmark" href="index.html" aria-label="Ashford, love, Khai, return to opening">Ashford <span aria-hidden="true">♡</span> Khai</a>
      <span class="dedication">a little love letter, just for you</span>
      <button class="text-button" id="letter-button">The full letter <span aria-hidden="true">↗</span></button>
    </header>

    <main id="main">
      <section class="cover" id="cover" aria-labelledby="cover-title">
        <div class="cover-copy">
          <p class="eyebrow">HAPPY FIRST MONTHSARY</p>
          <h1 id="cover-title">One month.<br><em>A lifetime to go.</em></h1>
          <button class="primary" id="start">Open your surprise <span aria-hidden="true">↗</span></button>
        </div>
        <div class="photographs" aria-label="Our two photos">
          <figure class="polaroid photo-him"><div class="photo-window"><img src="assets/him.jpg" width="720" height="720" alt="You, sitting in front of the green mountains in Siargao" fetchpriority="high"></div><figcaption>the lucky one</figcaption></figure>
          <figure class="polaroid photo-her"><div class="photo-window"><img src="assets/her.jpg" width="1320" height="1320" alt="Your darling, wearing glasses and a heart necklace" fetchpriority="high"></div><figcaption>my favorite person ♡</figcaption></figure>
          <span class="photo-note" aria-hidden="true">somehow, a game<br>led me to you.</span>
        </div>
      </section>

      <section class="film" id="film" hidden aria-label="Our animated love letter">
        <div class="chapter-line"><span id="chapter-label"></span><span id="scene-number"></span></div>
        <div id="scene" class="scene" aria-live="off"></div>
        <p class="sr-only" id="scene-announcement" role="status"></p>
        <div class="transport">
          <label class="sr-only" for="timeline">Presentation position</label>
          <input id="timeline" class="timeline" type="range" min="0" max="100" value="0" step="0.1" aria-valuetext="Beginning">
          <div class="transport-row">
            <span class="time" id="time">0:00 / 0:00</span>
            <div class="playback-buttons">
              <button id="previous" class="icon-button" aria-label="Previous scene">←</button>
              <button id="play" class="play-button" aria-label="Pause presentation">Pause</button>
              <button id="next" class="icon-button" aria-label="Next scene">→</button>
            </div>
            <label class="pace"><span>Reading pace</span><select id="pace" aria-label="Reading pace"><option value="0.6">Slow</option><option value="0.8">Normal</option><option value="1" selected>Quick</option></select></label>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-note">for all the days still to come.</span>
    </footer>
  </div>

  <dialog id="letter-dialog" class="letter-dialog" aria-labelledby="letter-title">
    <div class="dialog-top"><span>A LETTER FOR MY DARLING</span><button class="close-button" data-close="letter-dialog" aria-label="Close full letter">×</button></div>
    <h2 id="letter-title">Happy 1st monthsary,<br><em>darling.</em></h2>
    <div id="full-letter" class="full-letter"></div>
    <div class="letter-signoff">Always choosing you. ♡</div>
    <button class="primary" data-close="letter-dialog">Back to our story</button>
  </dialog>

  <audio id="audio" preload="metadata" loop></audio>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><div class="noscript">Please enable JavaScript to open your animated love letter.</div></noscript>
</body>
</html>
